<!doctype html>
<!-- Source for assets/social-card.png (1200x630). Render it in Chromium at that size and screenshot. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root { --ink:#080810; --navy:#10152B; --crimson:#F5223D; --cyan:#00E5FF; --violet:#8B35F6; --magenta:#FF36B5; --paper:#F4F0E8; --yellow:#FFE14A; --violet-deep:#24124F; }
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:var(--ink); }
  .card { position:relative; width:1200px; height:630px; overflow:hidden;
    background: radial-gradient(70% 90% at 82% 30%, var(--violet-deep), var(--navy) 45%, var(--ink) 80%); font-family:"IBM Plex Mono", monospace; color:var(--paper); }
  .dots { position:absolute; inset:0; background: radial-gradient(circle, var(--crimson) 0 2px, transparent 2.6px) 0 0/11px 11px;
    -webkit-mask-image: radial-gradient(60% 80% at 85% 100%, #000 10%, transparent 70%); opacity:.55; }
  .rays { position:absolute; inset:-10%; background: repeating-conic-gradient(from 0deg at 82% 32%, rgb(244 240 232 / .07) 0 .6deg, transparent .6deg 5deg);
    -webkit-mask-image: radial-gradient(circle at 82% 32%, transparent 0 12%, #000 26%, transparent 62%); }
  .ring { position:absolute; width:440px; height:440px; right:-60px; top:-40px; border-radius:50%; border:12px dashed var(--violet); opacity:.9; }
  .ring2 { position:absolute; width:300px; height:300px; right:10px; top:30px; border-radius:50%; background: radial-gradient(circle, var(--ink) 60%, var(--violet-deep)); box-shadow: -6px 0 0 4px var(--cyan), 6px 0 0 4px var(--crimson); }
  .mast { position:absolute; left:64px; right:64px; top:44px; display:flex; justify-content:space-between; font-size:15px; letter-spacing:.16em; text-transform:uppercase; color:rgb(244 240 232 / .7); border-top:3px solid var(--paper); padding-top:10px; }
  .eyebrow { position:absolute; left:64px; top:118px; display:flex; gap:18px; align-items:center; font-size:17px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); }
  .eyebrow b { background:var(--cyan); color:var(--ink); padding:4px 10px; }
  .name { position:absolute; left:58px; top:176px; font-family:Anton, Impact, sans-serif; font-size:158px; line-height:.82; text-transform:uppercase; }
  .l1 { color:var(--paper); text-shadow:-6px 0 0 var(--crimson), 6px 0 0 var(--cyan); }
  .l2 { margin-left:120px; color:transparent; -webkit-text-stroke:3px var(--paper); text-shadow:9px 9px 0 var(--crimson); }
  .cap { position:absolute; left:64px; bottom:56px; max-width:560px; padding:14px 18px; background:var(--yellow); color:var(--ink); border:4px solid var(--ink); box-shadow:8px 8px 0 var(--crimson); transform:rotate(-1.5deg);
    font-family:Anton, Impact, sans-serif; font-size:30px; line-height:1.1; text-transform:uppercase; }
</style></head>
<body><div class="card">
  <div class="rays"></div><div class="dots"></div><div class="ring"></div><div class="ring2"></div>
  <div class="mast"><span>Portfolio · Vol. 2026</span><span>Vijayawada · IN</span></div>
  <div class="eyebrow"><b>AI/ML Engineer</b><span>Generative AI · Computer Vision · Trustworthy ML</span></div>
  <div class="name"><div class="l1">Naishadh</div><div class="l2">Vytla</div></div>
  <div class="cap">I build models that know when not to trust themselves.</div>
</div></body></html>
