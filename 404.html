<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrong universe · Naishadh Vytla</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://naishadhvytla.github.io/new/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@400&display=swap">
<style>
  :root { --ink:#080810; --navy:#10152B; --crimson:#F5223D; --cyan:#00E5FF; --paper:#F4F0E8; --paper-80:rgb(244 240 232 / .8); --yellow:#FFE14A; --violet-deep:#24124F; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
    color: var(--paper); font: 400 1rem/1.6 Sora, system-ui, sans-serif;
    background: radial-gradient(70% 70% at 70% 30%, var(--violet-deep), var(--navy) 45%, var(--ink) 80%);
  }
  main { max-width: 640px; }
  .code { margin: 0; font: 600 .75rem/1 "IBM Plex Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
  h1 { margin: 12px 0 16px; font: 400 clamp(3.5rem, 14vw, 8rem)/.86 Anton, Impact, sans-serif; text-transform: uppercase;
    text-shadow: -.03em 0 var(--crimson), .03em 0 var(--cyan); }
  .cap { display: inline-block; margin: 0 0 28px; padding: 12px 16px; color: var(--ink); background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--crimson); transform: rotate(-1.5deg); font: 400 1.25rem/1.15 Anton, Impact, sans-serif; text-transform: uppercase; }
  p { color: var(--paper-80); }
  a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 20px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--crimson); font: 600 .8125rem/1 "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  a.btn:hover { box-shadow: 7px 7px 0 var(--crimson), -4px -4px 0 var(--cyan); }
  a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404 · Page not found</p>
  <h1>Wrong universe</h1>
  <p class="cap">This page doesn’t exist in this dimension.</p>
  <p>The link may be old or mistyped. The whole portfolio lives on one page.</p>
  <a class="btn" href="https://naishadhvytla.github.io/new/">Back to the cover</a>
</main>
</body>
</html>
